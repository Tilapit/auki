name: Data

# The nightly data pipeline (PLAN.md 7.2): OpenStreetMap's pharmacies for the covered
# countries, as static tiles on a host of their own. The app is not rebuilt for data.
#
# - Every night, and by hand: the whole coverage, then publish.
# - At the end of the same run, a second pass for the countries that failed (Janne's decision
#   of 26 Nov 2026): ten minutes later, only those countries, and the site is published once,
#   with whatever the two passes got.
# - Later the same night, another attempt for the countries that still have older data.
#   With none of them it fetches nothing and publishes nothing.
# - On a push that touches the pipeline: Malta alone, nothing published. It shows in the
#   pull request that the pipeline still runs here and that Overpass answers this runner.
#
# GitHub switches a public repository's schedules off after 60 days without a commit.
# The data page and the app's seven-day rule would show it; "Enable workflow" on this
# workflow's page switches it back on.
on:
  schedule:
    # 01:17 UTC: night in Europe, and off the hour, when the shared runners are less busy.
    - cron: '17 1 * * *'
    # The second attempt, two and a half hours later. The same line is in RETRY_SCHEDULE below.
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      countries:
        description: Countries to refresh, as ISO codes with spaces between (empty for all)
        type: string
        default: ''
      retry:
        description: Only the countries the last run could not refresh
        type: boolean
        default: false
      publish:
        description: Publish the tiles
        type: boolean
        default: true
  push:
    paths:
      - 'pipeline/**'
      - '.github/workflows/data.yml'

# One run at a time, and a running one is never cancelled: it may be publishing.
concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The opening_hours library reads local time: the pipeline treats it as wall clock (PLAN.md 7.4).
  TZ: UTC
  # The published site (decision D7), read for the last run's numbers and for the data of a
  # country that can't be refreshed. Until it has been published to, every run is a first run.
  TILES_ORIGIN: https://auki-data.vercel.app
  RETRY_SCHEDULE: '47 3 * * *'

jobs:
  data:
    name: Pipeline
    runs-on: ubuntu-latest
    # Two passes, each of which may wait ten minutes for a country that does not answer and
    # gives up after three in a row; the pause between them; the publish.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # Node runs the TypeScript pipeline as it is, without a build step.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch, normalise, parse hours, check, write tiles
        id: pipeline
        # Exit code 2 means the site was written but a country kept older data: publish, then fail.
        continue-on-error: true
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          COUNTRIES: ${{ github.event_name == 'push' && 'MT' || inputs.countries }}
          RETRY: ${{ (github.event.schedule == env.RETRY_SCHEDULE || inputs.retry == true) && '--retry' || '' }}
        run: npm run data -- $RETRY $COUNTRIES

      # The public Overpass servers are busy by the hour: on 24 and 25 Nov 2026 countries that
      # failed got through when asked again later. The pipeline reads the last run from its own
      # output, so --retry here asks only for what the first pass left with older data, or without any.
      - name: Second pass, for the countries that failed
        id: second
        if: steps.pipeline.outcome == 'failure' && github.event_name != 'push'
        continue-on-error: true
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          COUNTRIES: ${{ inputs.countries }}
        run: |
          # Not at once: a server that has just said no says it again.
          sleep 600
          npm run data -- --retry $COUNTRIES

      - name: Publish the tiles
        if: (steps.pipeline.outputs.written == 'true' || steps.second.outputs.written == 'true') && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::The tiles were built but not published: VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID must all be set as secrets."
            exit 1
          fi
          # Thousands of small files: sent as one archive, which also stays clear of the upload rate limit.
          npx --yes vercel@66 deploy .data/site --prod --yes --archive=tgz --token "$VERCEL_TOKEN"

      # What counts is how the run ended: the second pass's word where there was one.
      - name: Fail when a country was not refreshed
        if: steps.second.outcome == 'failure' || (steps.pipeline.outcome == 'failure' && steps.second.outcome != 'success')
        env:
          NOT_FRESH: ${{ steps.second.outcome == 'failure' && steps.second.outputs.not_fresh || steps.pipeline.outputs.not_fresh }}
        run: |
          # The countries are named here so that the list of runs answers "which ones, how often".
          echo "::error::Not refreshed: ${NOT_FRESH:-nothing could be written}. See the table in the summary."
          exit 1
