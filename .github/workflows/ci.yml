name: CI

# Every push, on every branch. Pull requests show these checks through their head commit,
# so there is no separate pull_request trigger to run everything twice.
on:
  push:
  workflow_dispatch:
    inputs:
      baselines:
        description: Make new visual baselines and upload them as an artifact
        type: boolean
        default: false

# A new push to a branch cancels the run still going for it: the repository is private
# and Actions minutes are limited. Linux only, for the same reason.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A commit whose message contains [baselines] asks for new visual baselines instead of a comparison.
  WANTS_BASELINES: ${{ inputs.baselines == true || contains(github.event.head_commit.message, '[baselines]') }}

jobs:
  ci:
    name: Checks
    runs-on: ubuntu-latest
    # A run takes about 20 minutes since M7 (axe, the keyboard and reflow on every view); it took 12 before.
    timeout-minutes: 40
    # The browsers and their system libraries come with the image, pinned to the Playwright
    # version in package.json. The visual baselines are made in this same image.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The real build first: its budgets, and the promise that nothing under /dev is in it.
      - name: Production build
        run: npm run build

      - name: Lighthouse budgets (initial JavaScript, mobile LCP)
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx lhci autorun

      - name: Nothing under /dev exists in the production build
        run: |
          TZ=UTC npx next start -p 3200 &
          SERVER=$!
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3200/fi && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3200/fi)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3200/fi/dev/states)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3200/fi/dev/states/helsinki)" = "404"
          kill "$SERVER" || true

      # Then a build that keeps the /dev pages, for the browser tests: a production server
      # answers several times faster than the dev server.
      - name: Build with the /dev pages
        run: DEV_ROUTES=1 npm run build

      - name: Playwright, with visual comparison of /dev/states
        if: env.WANTS_BASELINES != 'true'
        run: npx playwright test

      - name: Upload the comparisons that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7

      - name: Make new visual baselines
        if: env.WANTS_BASELINES == 'true'
        run: npx playwright test tests/e2e/visual.spec.ts --update-snapshots

      - name: Upload the new baselines
        if: env.WANTS_BASELINES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: baselines
          path: tests/e2e/__screenshots__/
          retention-days: 3

      - name: Measured numbers
        if: always()
        run: |
          if [ -d .lighthouseci/reports ]; then
            node scripts/budget-summary.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          fi
